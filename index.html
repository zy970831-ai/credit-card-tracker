<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Benefit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
        <span class="brand-name">Card Benefits Tracker</span>
      </div>
      <div class="header-summary" id="headerSummary"></div>
    </header>

    <div class="layout">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <h2 class="sidebar-title">My Cards</h2>
          <span class="badge" id="cardCountBadge">0</span>
        </div>

        <div class="add-card-area">
          <select id="cardSelector" class="select-input">
            <option value="">Select a card to add...</option>
          </select>
          <button id="addCardBtn" class="btn-add">Add</button>
        </div>

        <div id="myCardsList" class="cards-list">
          <p class="sidebar-empty">No cards yet. Pick one above.</p>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main" id="mainContent">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
          </div>
          <h2>Track Your Card Benefits</h2>
          <p>Add a credit card from the sidebar to start tracking monthly and annual perks.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Benefit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="benefitModal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Benefit</h3>
        <button class="modal-close-btn" id="modalCloseBtn">&#x2715;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editingBenefitId">
        <div class="form-group">
          <label class="form-label">Benefit Name *</label>
          <input type="text" id="inputName" class="form-input" placeholder="e.g. $200 Airline Fee Credit">
        </div>
        <div class="form-row-two">
          <div class="form-group">
            <label class="form-label">Value ($) *</label>
            <input type="number" id="inputValue" class="form-input" placeholder="200" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Resets</label>
            <select id="inputType" class="form-input">
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="semi-annual">Semi-Annual</option>
              <option value="annual" selected>Annual</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="inputCategory" class="form-input">
            <option value="Travel">Travel</option>
            <option value="Dining">Dining</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Transportation">Transportation</option>
            <option value="Fitness">Fitness</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="inputDesc" class="form-input form-textarea" placeholder="Where / how to use this benefit..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
        <button class="btn-primary" id="modalSaveBtn">Save Benefit</button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal modal-sm" id="confirmModal">
      <div class="modal-header">
        <h3 id="confirmTitle">Confirm</h3>
        <button class="modal-close-btn" id="confirmCloseBtn">&#x2715;</button>
      </div>
      <div class="modal-body">
        <p id="confirmMessage"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
        <button class="btn-danger" id="confirmOkBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
